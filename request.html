<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>依頼｜購入の依頼と決裁（見本）</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-who="見本 花子（総務部）">
<header class="top" data-shell-header></header>
<main class="main">
  <div data-stage="1"></div>

  <section class="decide">
    <h1>依頼の入力</h1>
    <p class="verdict"><b>送れます</b><span>必須は全て入り、コードは全て一覧にあります</span></p>
    <div class="actions">
      <button class="btn primary" type="button" data-done="見本のため送信はされません">確かめて送る</button>
      <button class="btn" type="button" data-done="見本のため保存はされません">下書きに残す</button>
      <span class="after">送ると、共通IT決裁への入力と申請は RPA が行います</span>
    </div>
  </section>

  <div class="scroll">
    <details class="fold"><summary>項目を開いて入れる（必須の印つき）</summary><form class="fields body" aria-label="依頼の項目" onsubmit="return false">
      <fieldset><legend>申請者（自動で入ります）</legend>
        <label><span>申請者</span><output>見本 花子</output></label>
        <label><span>部署</span><output>総務部</output></label>
      </fieldset>
      <fieldset><legend>買う物</legend>
        <label><span>品名<em class="must">必須</em></span><input type="text" value="ディスプレイ 50 型"></label>
        <label><span>数量<em class="must">必須</em></span><input type="number" value="2"></label>
        <label class="wide"><span>購入の理由<em class="must">必須</em></span><input type="text" value="第 3 会議室の打ち合わせ用"></label>
      </fieldset>
      <fieldset><legend>取引先と金額</legend>
        <label><span>取引先<em class="must">必須</em></span><select><option>見本電機（仮）</option><option>例示商事（仮）</option></select></label>
        <label><span>金額（税別）<em class="must">必須</em></span><input type="text" value="96,000 円"></label>
        <label class="wide"><span>見積書<em class="must">必須</em></span><input type="text" value="見積書_見本電機.pdf（添付済み）" readonly></label>
      </fieldset>
      <fieldset><legend>コード類（一覧から選ぶ）</legend>
        <label><span>案件のコード<em class="must">必須</em></span><select><option>X-000-01 共用設備</option></select></label>
        <label><span>プロセスコード<em class="must">必須</em></span><select><option>P-10 物品購入</option></select></label>
        <label><span>部課のコード<em class="must">必須</em></span><select><option>S-100 総務部</option></select></label>
        <label><span>税金コード<em class="must">必須</em></span><select><option>10% 外税</option><option>8% 外税</option><option>内税</option></select></label>
        <label><span>勘定科目<em class="must">必須</em></span><select><option>0000000001 備品費</option></select></label>
      </fieldset>
      <fieldset><legend>納品先</legend>
        <label><span>納品場所<em class="must">必須</em></span><input type="text" value="本社 3 階 第 3 会議室"></label>
        <label><span>宛名<em class="must">必須</em></span><input type="text" value="見本 花子"></label>
        <label><span>電話番号<em class="must">必須</em></span><input type="text" value="00-0000-0000"></label>
      </fieldset>
      <fieldset><legend>決裁</legend>
        <label><span>決裁権者<em class="must">必須</em></span><select><option>例示 次郎（総務部 課長）</option></select></label>
        <label><span>合議者</span><select><option>なし</option></select></label>
      </fieldset>
    </form></details>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
