<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受け取り｜購入の依頼と決裁（見本）</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-who="見本 花子（総務部）">
<header class="top" data-shell-header></header>
<main class="main">
  <div data-stage="8"></div>

  <section class="decide">
    <h1>届いた物は注文どおりですか</h1>
    <dl class="facts">
      <dt>何が</dt><dd>ディスプレイ 50 型 ×2、壁掛け金具 ×2</dd>
      <dt>どこへ</dt><dd>第 3 会議室<small>R-0142</small></dd>
      <dt>誰から</dt><dd>見本電機（仮）<small>納品書 D-0031</small></dd>
    </dl>
    <p class="verdict"><b>問題なし</b><span>納品書の品目と数は注文と一致</span></p>
    <div class="actions">
      <button class="btn primary" type="button" data-done="受け取りを記録しました。請求書を待ちます（見本）">注文どおり</button>
      <button class="btn" type="button" data-done="違いを受け付けました。写真か理由を添えて承認者へ回します（見本）">違う・壊れている</button>
    </div>
  </section>

  <div class="scroll">
    <details class="fold">
      <summary>写真で返す</summary>
      <div class="body">
        <div class="photo">箱の写真（見本）</div>
        <p class="small muted">AI が品目と数を読み取ります。自信が低いときは 1 問だけ聞き返します。</p>
      </div>
    </details>
  </div>
</main>
<script src="assets/app.js"></script>
</body>
</html>
